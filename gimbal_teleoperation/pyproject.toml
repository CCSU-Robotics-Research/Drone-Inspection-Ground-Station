[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "heq_gimbal"
version = "0.2.0"
description = "HoloLens to HEQ G-PORT Gimbal Teleoperation Bridge"
requires-python = ">=3.9"
dependencies = ["pyserial>=3.5", "pytest>=8", "pycodestyle>=2.11"]

[tool.setuptools]
py-modules = [
    "heq_protocol",
    "udp_receiver",
    "gimbal_controller",
    "singleton",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
