[build-system]
requires = ["setuptools", "wheel"]
build-backend ="setuptools.build_meta"

[project]
name = "heq_gimbal"
description = "HoloLens to Gimbal Teleoperation Bridge"
requires-python = ">=3.9"
dependencies = ["pyserial>=3.5"]

[tool.setuptools]
py-modules = [
    "heq_protocol",
    "udp_reeciver",
    "gimbal_controller",
    "singleton",
]
