[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "camera_vision"
version = "0.2.0"
description = "Ground Station Camera Feed Reading and AI Annotation"
requires-python = ">=3.9"
dependencies = ["opencv-python>=4.8"]

[project.optional-dependencies]
dev = ["pytest>=8", "pycodestyle>=2.11"]

[tool.setuptools]
py-modules = [
    "read_feed",
    "stream",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
