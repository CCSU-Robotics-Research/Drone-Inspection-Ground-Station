[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "camera_vision"
version = "0.6.0"
description = "Ground Station Camera Feed Reading and AI Annotation"
requires-python = ">=3.9"
dependencies = ["opencv-python>=4.8"]

[project.optional-dependencies]
dev = ["pytest>=8", "pycodestyle>=2.11"]
ai = [
    "torch>=2.4",
    "torchvision>=0.19",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "seaborn>=0.13",
]

[tool.setuptools]
py-modules = [
    "commands",
    "read_feed",
    "record",
    "stream",
]
packages = ["ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
