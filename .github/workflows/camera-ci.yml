# Continuous integration (CI) for camera vision. This CI workflow
# only runs when gimbal code files (or this file) are altered.

name: camera-vision

on:
  push:
    paths:
      - "camera_vision/**"
      - ".github/workflows/camera-ci.yml"
    pull_request:
      paths:
        - "camera_vision/**"
        - ".github/workflows/camera-ci.yml"

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: camera_vision
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package + dev tools
        run: pip install -e ".[dev]"

      - name: Lint (PEP 8)
        run: pycodestyle --exclude=venv,.venv,__pycache__ .

      - name: Unit tests
        run: pytest tests -v