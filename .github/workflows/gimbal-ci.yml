# Continuous integration (CI) for gimbal teleoperation. This CI workflow
# only runs when gimbal code files (or this file) are altered.

name: gimbal-teleoperation

on:
  push:
    paths:
      - "gimbal_teleoperation/**"
      - ".github/workflows/gimbal-ci.yml"
  pull_request:
    paths:
      - "gimbal_teleoperation/**"
      - ".github/workflows/gimbal-ci.yml"

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: gimbal_teleoperation
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install package + dev tools
        run: pip install -e ".[dev]"

      - name: Lint (PEP 8)
        run: pycodestyle --exclude=venv,.venv,__pycache__ .

      - name: Unit tests
        run: pytest tests -v
